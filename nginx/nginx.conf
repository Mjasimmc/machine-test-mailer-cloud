events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with Correlation & Upstream Timing
    log_format production '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                          'cid="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log production;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Edge Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones (DDoS / Brute-force protection at Edge)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_sensitive:10m rate=5r/s;

    # Upstream API Cluster (Horizontal Stateless Load Balancing)
    upstream api_backend {
        least_conn;
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream Web Frontend (SPA)
    upstream web_frontend {
        server web:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Forwarded Security Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;

        # Global Edge Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # WebSocket Gateway Proxy (Socket.IO horizontal scaling)
        location /socket.io/ {
            proxy_pass http://api_backend/socket.io/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Sensitive Authentication Routes (Strict Edge Rate Limiting)
        location ~ ^/(auth/login|auth/register|auth/refresh|auth/change-password) {
            limit_req zone=api_sensitive burst=10 nodelay;
            proxy_pass http://api_backend;
        }

        # Sensitive Public Submission Route (Edge Rate Limiting)
        location ~ ^/public/forms/[^/]+/submissions {
            limit_req zone=api_sensitive burst=20 nodelay;
            proxy_pass http://api_backend;
        }

        # Public Forms (Edge Caching Validation with Deterministic Strong ETag & Last-Modified)
        location ~ ^/public/forms/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_pass_header ETag;
            proxy_pass_header Cache-Control;
            proxy_pass_header Last-Modified;
        }

        # General REST API Routes
        location ~ ^/(forms|auth|users|admin|dashboard|health) {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api_backend;
        }

        # Web Application Frontend
        location / {
            proxy_pass http://web_frontend;
        }
    }
}
