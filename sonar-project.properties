# ==============================================================================
# SonarQube & SonarCloud Monorepo Configuration (Strict Quality Standards)
# ==============================================================================

sonar.projectKey=saas-enterprise-platform
sonar.projectName=SaaS Enterprise Platform Monorepo
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/test

# Encoding & Language settings
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.base.json,apps/api/tsconfig.json,apps/web/tsconfig.json,packages/shared/tsconfig.json

# File Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/uploads/**,**/.next/**,**/.turbo/**,**/*.spec.ts,**/*.e2e-spec.ts,**/seed.ts

# Coverage Exclusions
sonar.coverage.exclusions=**/test/**,**/*.e2e-spec.ts,**/*.spec.ts,**/*.dto.ts,**/*.schema.ts,**/*.module.ts,**/main.ts,**/index.ts,**/seed.ts

# Duplications & Code Smells Strict Controls
sonar.cpd.exclusions=**/*.dto.ts,**/*.schema.ts,**/*.scss,**/*.css
sonar.cpd.typescript.minimumtokens=50
sonar.cpd.typescript.minimumLines=10

# Coverage Reports
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info

# Quality Gate & Security Invariants
sonar.qualitygate.wait=true
sonar.scm.disabled=false
sonar.security.sources=apps/api/src,apps/web/src
sonar.issue.ignore.multicriteria=
