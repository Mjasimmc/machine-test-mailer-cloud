name: CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history for SonarQube analysis

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get PNPM Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup PNPM Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Typecheck Workspace Packages
        run: pnpm lint

      - name: Build All Monorepo Workspaces
        run: pnpm build

      - name: Seed Database
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/saas_db
        run: pnpm db:seed

      - name: Run Backend Unit & E2E Test Suite
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/saas_db
          JWT_SECRET: ci-test-secret-key-for-auth-unit-tests
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: ci-test-refresh-secret-key-32-chars
          JWT_REFRESH_EXPIRES_IN: 7d
        run: pnpm --filter @saas/api test

      - name: SonarQube / SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
